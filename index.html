<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QABAS Club | Scientific Club</title>

    <!-- QABAS LOGO / FAVICON -->
    <link rel="icon" type="image/jpeg" href="qabas.club.jpg">
    <link rel="apple-touch-icon" href="qabas.club.jpg">

    <meta
        name="description"
        content="QABAS Scientific Club - Faculty of Medicine Mostaganem"
    >

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --primary: #164d32;
            --primary-light: #28794e;
            --primary-dark: #0b2c1c;

            --secondary: #a9c85a;
            --secondary-light: #d9e99d;

            --accent: #d5ad42;

            --bg: #f8faf7;
            --bg-2: #eef5ee;

            --white: #ffffff;

            --text: #122219;
            --text-light: #68746c;

            --border: #dfe8e0;

            --shadow-sm:
                0 8px 25px rgba(13, 50, 33, 0.07);

            --shadow-md:
                0 18px 50px rgba(13, 50, 33, 0.12);

            --shadow-lg:
                0 30px 80px rgba(13, 50, 33, 0.17);

            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 30px;

            --transition: all 0.35s ease;
        }


        /* =========================================================
           DARK MODE
        ========================================================= */

        body.dark {

            --bg: #07130d;
            --bg-2: #0d1d14;

            --white: #102219;

            --text: #edf7ef;
            --text-light: #aab8ad;

            --border: #213a2b;

            --shadow-sm:
                0 8px 25px rgba(0, 0, 0, 0.22);

            --shadow-md:
                0 18px 50px rgba(0, 0, 0, 0.32);

            --shadow-lg:
                0 30px 80px rgba(0, 0, 0, 0.42);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: "Inter", sans-serif;

            background: var(--bg);

            color: var(--text);

            line-height: 1.6;

            overflow-x: hidden;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        img {
            width: 100%;
            display: block;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        ul {
            list-style: none;
        }

        ::selection {
            background: var(--secondary);
            color: var(--primary-dark);
        }


        /* =========================================================
           CONTAINER
        ========================================================= */

        .container {

            width: min(1180px, 92%);

            margin: auto;
        }


        /* =========================================================
           PRELOADER
        ========================================================= */

        .preloader {

            position: fixed;

            inset: 0;

            background: var(--primary-dark);

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }

        .preloader.hide {

            opacity: 0;

            visibility: hidden;
        }

        .loader {

            width: 55px;
            height: 55px;

            border-radius: 50%;

            border:
                4px solid rgba(255,255,255,0.15);

            border-top-color: var(--secondary);

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            padding: 18px 0;

            transition: var(--transition);
        }

        header.scrolled {

            padding: 9px 0;

            background:
                rgba(248,250,247,0.90);

            backdrop-filter: blur(20px);

            box-shadow:
                0 8px 30px rgba(0,0,0,0.06);
        }

        body.dark header.scrolled {

            background:
                rgba(7,19,13,0.90);
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        .navbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            font-weight: 800;

            font-size: 20px;

            letter-spacing: -0.5px;
        }

        .logo-image {

            width: 52px;
            height: 52px;

            border-radius: 50%;

            overflow: hidden;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow: var(--shadow-sm);

            flex-shrink: 0;
        }

        .logo-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .logo-text {

            line-height: 1.1;
        }

        .logo-text span {

            display: block;

            color: var(--secondary);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-top: 5px;
        }


        /* =========================================================
           NAV LINKS
        ========================================================= */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 30px;
        }

        .nav-links a {

            position: relative;

            font-size: 14px;

            font-weight: 600;

            color: var(--text-light);

            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {

            color: var(--primary);
        }

        body.dark .nav-links a:hover,
        body.dark .nav-links a.active {

            color: var(--secondary);
        }

        .nav-links a::after {

            content: "";

            position: absolute;

            width: 0;

            height: 2px;

            bottom: -7px;

            left: 50%;

            transform: translateX(-50%);

            background: var(--secondary);

            transition: var(--transition);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {

            width: 100%;
        }


        /* =========================================================
           NAV ACTIONS
        ========================================================= */

        .nav-actions {

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .icon-btn {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: grid;

            place-items: center;

            background: var(--white);

            color: var(--text);

            box-shadow: var(--shadow-sm);

            transition: var(--transition);

            font-size: 17px;
        }

        .icon-btn:hover {

            transform: translateY(-3px);

            color: var(--primary);
        }

        .menu-btn {

            display: none;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            min-height: 100vh;

            padding-top: 150px;

            padding-bottom: 80px;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;
        }

        .hero::before {

            content: "";

            position: absolute;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(169,200,90,0.23),
                    transparent 68%
                );

            right: -250px;

            top: -150px;
        }

        .hero::after {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(35,115,74,0.13),
                    transparent 68%
                );

            left: -250px;

            bottom: -200px;
        }

        .hero-grid {

            display: grid;

            grid-template-columns:
                1.05fr
                0.95fr;

            align-items: center;

            gap: 70px;

            position: relative;

            z-index: 2;
        }

        .hero-content {

            animation:
                fadeUp 1s ease both;
        }

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(35px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .badge {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border-radius: 50px;

            background:
                rgba(169,200,90,0.17);

            color: var(--primary);

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 22px;
        }

        body.dark .badge {

            color: var(--secondary-light);
        }

        .badge-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--secondary);

            box-shadow:
                0 0 0 5px
                rgba(169,200,90,0.15);
        }

        .hero h1 {

            font-family: "Manrope", sans-serif;

            font-size:
                clamp(45px, 6vw, 78px);

            line-height: 1.02;

            letter-spacing: -4px;

            margin-bottom: 25px;

            max-width: 750px;
        }

        .hero h1 .green {

            color: var(--primary-light);
        }

        body.dark .hero h1 .green {

            color: var(--secondary);
        }

        .hero-description {

            color: var(--text-light);

            font-size: 17px;

            max-width: 590px;

            margin-bottom: 34px;
        }

        .hero-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 14px;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 15px 22px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 700;

            transition: var(--transition);
        }

        .btn-primary {

            background: var(--primary);

            color: white;

            box-shadow:
                0 12px 30px
                rgba(22,77,50,0.22);
        }

        .btn-primary:hover {

            background: var(--primary-light);

            transform: translateY(-3px);

            box-shadow:
                0 17px 35px
                rgba(22,77,50,0.30);
        }

        .btn-outline {

            background: var(--white);

            border: 1px solid var(--border);

            color: var(--text);
        }

        .btn-outline:hover {

            border-color: var(--secondary);

            transform: translateY(-3px);
        }


        /* =========================================================
           HERO VISUAL
        ========================================================= */

        .hero-visual {

            position: relative;

            min-height: 550px;
        }

        .hero-card {

            position: absolute;

            inset: 35px 25px 35px 25px;

            border-radius: 40px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(22,77,50,0.90),
                    rgba(35,115,74,0.62)
                ),
                url(
                    "https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=1200&q=85"
                )
                center/cover;

            box-shadow: var(--shadow-lg);

            transition:
                transform 0.2s ease;
        }

        .hero-card::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(213,232,154,0.45),
                    transparent 25%
                ),
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(5,25,15,0.45)
                );
        }

        .hero-card-content {

            position: absolute;

            left: 35px;
            right: 35px;

            bottom: 35px;

            color: white;
        }

        .hero-card-content small {

            color: var(--secondary-light);

            text-transform: uppercase;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 700;
        }

        .hero-card-content h3 {

            font-size: 28px;

            margin-top: 7px;
        }


        /* =========================================================
           FLOATING CARDS
        ========================================================= */

        .floating-card {

            position: absolute;

            background:
                rgba(255,255,255,0.94);

            color: var(--text);

            border-radius: 18px;

            padding: 17px 19px;

            box-shadow: var(--shadow-md);

            backdrop-filter: blur(15px);

            z-index: 3;
        }

        body.dark .floating-card {

            background:
                rgba(16,34,25,0.94);

            color: white;
        }

        .floating-card.one {

            top: 15px;

            right: -5px;

            animation:
                float 4s ease-in-out infinite;
        }

        .floating-card.two {

            bottom: 15px;

            left: -15px;

            animation:
                float 4s ease-in-out infinite 1s;
        }

        @keyframes float {

            0%,100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-12px);
            }
        }

        .floating-number {

            font-size: 25px;

            font-weight: 800;

            color: var(--primary);
        }

        body.dark .floating-number {

            color: var(--secondary);
        }

        .floating-label {

            font-size: 11px;

            color: var(--text-light);
        }


        /* =========================================================
           STATS
        ========================================================= */

        .stats {

            position: relative;

            z-index: 5;

            margin-top: -35px;
        }

        .stats-box {

            background: var(--white);

            border: 1px solid var(--border);

            box-shadow: var(--shadow-md);

            border-radius: 22px;

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            padding: 10px;
        }

        .stat {

            text-align: center;

            padding: 25px 15px;

            position: relative;
        }

        .stat:not(:last-child)::after {

            content: "";

            position: absolute;

            width: 1px;

            height: 45px;

            right: 0;

            top: 50%;

            transform:
                translateY(-50%);

            background:
                var(--border);
        }

        .stat h3 {

            font-size: 30px;

            color: var(--primary);
        }

        body.dark .stat h3 {

            color: var(--secondary);
        }

        .stat p {

            color: var(--text-light);

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================================================
           SECTIONS
        ========================================================= */

        section {

            padding: 110px 0;
        }

        .section-head {

            text-align: center;

            max-width: 700px;

            margin:
                0 auto 60px;
        }

        .section-tag {

            display: inline-block;

            color: var(--primary-light);

            font-size: 12px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        body.dark .section-tag {

            color: var(--secondary);
        }

        .section-head h2 {

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(32px,4vw,50px);

            line-height: 1.1;

            letter-spacing: -2px;

            margin-bottom: 17px;
        }

        .section-head p {

            color: var(--text-light);
        }


        /* =========================================================
           ABOUT
        ========================================================= */

        .about {

            background: var(--bg-2);
        }

        .about-grid {

            display: grid;

            grid-template-columns:
                0.9fr
                1.1fr;

            gap: 80px;

            align-items: center;
        }

        .about-image {

            position: relative;
        }

        .about-image-main {

            height: 530px;

            object-fit: cover;

            border-radius: 30px;

            box-shadow: var(--shadow-lg);
        }

        .about-image-small {

            position: absolute;

            width: 190px;
            height: 190px;

            object-fit: cover;

            right: -35px;

            bottom: -35px;

            border:
                8px solid var(--bg-2);

            border-radius: 25px;
        }

        .about-content h2 {

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(32px,4vw,48px);

            line-height: 1.1;

            letter-spacing: -2px;

            margin-bottom: 20px;
        }

        .about-content > p {

            color: var(--text-light);

            margin-bottom: 28px;
        }

        .feature-list {

            display: grid;

            gap: 18px;
        }

        .feature {

            display: flex;

            gap: 15px;

            align-items: flex-start;
        }

        .feature-icon {

            flex:
                0 0 45px;

            width: 45px;
            height: 45px;

            display: grid;

            place-items: center;

            border-radius: 13px;

            background:
                rgba(169,200,90,0.18);

            color: var(--primary);

            font-size: 20px;
        }

        body.dark .feature-icon {

            color: var(--secondary);
        }

        .feature h4 {

            margin-bottom: 3px;
        }

        .feature p {

            color: var(--text-light
